name: inventario_app
description: "Aplicación móvil de gestión de inventarios con SQLite y generación de reportes PDF"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Persistencia de sesión
  shared_preferences: ^2.2.2
  # Base de datos local SQLite
  sqflite: ^2.3.0
  path: ^1.9.0
  # Generación e impresión de reportes en PDF
  pdf: ^3.10.8
  printing: ^5.13.1
  # Formato de moneda y fechas
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true